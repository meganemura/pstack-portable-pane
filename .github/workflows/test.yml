name: test

on:
  push:
    branches: [main]
  pull_request:

# Every third-party action and package version below is an exact pin (a commit SHA for
# actions, an exact version for npm packages). See AGENTS.md's dependency rule and
# docs/decisions/0002 for why tsc is not a CI gate.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - run: npm install -g @anthropic-ai/claude-code@2.1.295
      # Neither gate calls the model, so no API credential is needed.
      - run: claude plugin validate .
      - run: claude plugin validate plugin
      - run: claude plugin test plugin
